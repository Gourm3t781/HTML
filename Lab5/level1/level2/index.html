<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор стоимости заказа</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Кастомные стили -->
  <link rel="stylesheet" href="style.css" />
  
  <!-- Подключение внешнего JS файла с defer -->
  <script src="script.js" defer></script>
</head>

<body class="bg-light">

  <header class="header py-3 mb-4 border-bottom shadow-sm">
    <div class="container d-flex align-items-center justify-content-between">
      <span class="site-title h4 mb-0 fw-bold">Web-интерфейс | Лабораторная 5</span>
      <nav class="nav-menu">
        <a href="../index.html" class="btn btn-outline-secondary btn-sm">На главную</a>
      </nav>
    </div>
  </header>

  <main class="container my-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm p-4 custom-card">
          <h1 class="h3 mb-4 text-center">Калькулятор стоимости заказа</h1>

          <form id="order-form">
            <!-- Выбор товара -->
            <div class="mb-3">
              <label for="product-select" class="form-label fw-medium">Выберите товар:</label>
              <select id="product-select" name="product" class="form-select" required>
                <option value="450">Энергетический напиток (100 руб.)</option>
                <option value="1200" selected>Клавиатура механическая (1 200 руб.)</option>
                <option value="3500">Беспроводная мышь (3 500 руб.)</option>
                <option value="8900">Монитор 24" (8 900 руб.)</option>
              </select>
            </div>

            <!-- Количество товара -->
            <div class="mb-3">
              <label for="quantity" class="form-label fw-medium">Количество товара:</label>
              <input type="text" id="quantity" name="quantity" class="form-control" placeholder="Введите количество (целое число)" value="1" required />
            </div>

            <!-- Кнопка расчета -->
            <div class="d-grid mb-3">
              <button type="button" id="calc-btn" class="btn btn-warning fw-semibold text-dark">Рассчитать стоимость</button>
            </div>
          </form>

          <!-- Вывод результатов и ошибок -->
          <div id="error-output" class="text-danger fw-medium mt-2 text-center" role="alert"></div>
          <div id="result-output" class="alert alert-success mt-3 fs-5 fw-bold text-center" role="status"></div>

        </div>
      </div>
    </div>
  </main>

  <footer class="footer py-3 text-center border-top mt-5 bg-white">
    <div class="container">
      <span>(c) Бычков Никита 2026</span>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
